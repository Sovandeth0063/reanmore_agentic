lesson: "Worksheet demo: one sheet, 12 exercises"
version: 1
exercises:
  - {id: A1, section: A, item: 1, problem: "4 + 5 + 6", answer: 15, verification_expression: "4 + 5 + 6", steps: [{index: 1, prompt: "Add 4 and 5", expected_intermediate: 9, hints: ["Let's start with the first two numbers. Which two should we add?", "Put the 4 and the 5 together. What do you get?"]}, {index: 2, prompt: "Add 6 to 9", expected_intermediate: 15, hints: ["Nice start! Now bring in the last number.", "You have 9 so far. What do you get when you add 6 more?"]}], praise: "Great adding!"}
  - {id: A2, section: A, item: 2, problem: "63 + 24", answer: 87, verification_expression: "63 + 24", steps: [{index: 1, prompt: "Add the ones", expected_intermediate: 7, hints: ["Look at the ones digits first: the 3 and the 4.", "What is 3 plus 4? That is the ones part of your answer."]}, {index: 2, prompt: "Add the tens", expected_intermediate: 87, hints: ["The ones are done. Now look at the tens digits: the 6 and the 2.", "Add the tens together. What number goes in the tens place?"]}], praise: "Great place-value work!"}
  - {id: A3, section: A, item: 3, problem: "85 - 33", answer: 52, verification_expression: "85 - 33", steps: [{index: 1, prompt: "Subtract the ones", expected_intermediate: 2, hints: ["Start with the ones digits: the 5 and the 3.", "Take the 3 away from the 5. What is left in the ones place?"]}, {index: 2, prompt: "Subtract the tens", expected_intermediate: 52, hints: ["Now for the tens digits: the 8 and the 3.", "Take the 3 tens away from the 8 tens. What is left in the tens place?"]}], praise: "Great subtracting!"}
  - {id: A4, section: A, item: 4, problem: "71 - 8", answer: 63, verification_expression: "71 - 8", steps: [{index: 1, prompt: "Subtract 8 ones", expected_intermediate: 63, hints: ["The 1 in 71 is too small to take 8 away, so we need to borrow.", "Borrow a ten from the 7. Now you have 11 ones. What is 11 minus 8?"]}], praise: "You kept your place values!"}
  - {id: A5, section: A, item: 5, problem: "63 - 5", answer: 58, verification_expression: "63 - 5", steps: [{index: 1, prompt: "Subtract 5 ones", expected_intermediate: 58, hints: ["The 3 in 63 is smaller than 5, so borrow a ten from the 6.", "Now you have 13 ones. What is 13 minus 5?"]}], praise: "Nice subtraction!"}
  - {id: A6, section: A, item: 6, problem: "100 - 48", answer: 52, verification_expression: "100 - 48", steps: [{index: 1, prompt: "Subtract the ones and tens", expected_intermediate: 52, hints: ["Start at the ones. The 0 in 100 needs to borrow from the hundreds.", "After you borrow, try the tens: 9 tens take away 4 tens. What is left?"]}], praise: "Great regrouping!"}
  - {id: B1, section: B, item: 1, problem: "6 x 4", answer: 24, verification_expression: "6 * 4", steps: [{index: 1, prompt: "Think of 4 groups of 6", expected_intermediate: 24, hints: ["Multiplication is equal groups. Can you make 4 groups with 6 in each group?", "Skip count by 6: 6, 12, 18, then the next jump. What comes next?"]}], praise: "Great groups!"}
  - {id: B2, section: B, item: 2, problem: "8 x 3", answer: 24, verification_expression: "8 * 3", steps: [{index: 1, prompt: "Think of 3 groups of 8", expected_intermediate: 24, hints: ["Think of 3 groups with 8 in each group.", "Skip count by 8: 8, 16, then the next jump. What comes next?"]}], praise: "Great multiplication!"}
  - {id: B3, section: B, item: 3, problem: "9 x 3", answer: 27, verification_expression: "9 * 3", steps: [{index: 1, prompt: "Think of 3 groups of 9", expected_intermediate: 27, hints: ["Try 3 groups of 9. Counting by 9 can help.", "Skip count by 9: 9, 18, then the next jump. What comes next?"]}], praise: "You know that fact!"}
  - {id: B4, section: B, item: 4, problem: "20 / 4", answer: 5, verification_expression: "20 / 4", steps: [{index: 1, prompt: "Share 20 into 4 equal groups", expected_intermediate: 5, hints: ["Division is sharing into equal groups. How many groups of 4 can you make from 20?", "Count by 4 until you reach 20: 4, 8, 12, 16. How many counts did you make?"]}], praise: "Great sharing!"}
  - {id: B5, section: B, item: 5, problem: "80 / 10", answer: 8, verification_expression: "80 / 10", steps: [{index: 1, prompt: "Share 80 into 10 equal groups", expected_intermediate: 8, hints: ["Sharing by 10 is like taking away a zero. How many tens are in 80?", "Count by 10 to 80: 10, 20, 30, and keep going. How many tens did you count?"]}], praise: "Great division!"}
  - {id: B6, section: B, item: 6, problem: "25 / 5", answer: 5, verification_expression: "25 / 5", steps: [{index: 1, prompt: "Share 25 into 5 equal groups", expected_intermediate: 5, hints: ["Think of equal groups that fit into 25. Count by the group size from the problem.", "Which times-table fact makes 25? You are looking for equal groups that fit exactly."]}], praise: "Great work!"}
